version: 2.1

executors:
  linux:
    docker:
      - image: cimg/base:2025.12
    resource_class: arm.medium
  darwin:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
      

jobs:
  build-aarch64:
    executor: linux
    steps:
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install ninja-build gcc-10 g++-10 python3-pip
            sudo pip install meson
      - checkout
      - run:
          name: "Configure"
          command: "CC=gcc-10 CXX=g++-10 ci/configure.sh build"
      - run:
          name: "Build"
          command: "ci/build.sh build"
      - run:
          name: "Test"
          command: "ci/test.sh build"
      - store_test_results:
          path: build/a3_gtest.xml
  build-bazel:
    parameters:
      os:
        type: executor
      config:
        type: string
    executor: << parameters.os >>
    steps:
      - checkout
      - run:
          name: Install Nix
          command: |
            curl --proto '=https' --tlsv1.2 -sSf -L https://install.lix.systems/lix | sh -s -- install --no-confirm
      - run:
          name: Bazel test
          command: |
            sudo bash -c '. /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh && nix-shell --command "bazel test --config=<< parameters.config >> --repository_cache=./repo_cache //..."'
      - store_test_results:
          path: bazel-testlogs
workflows:
  build-and-test:
    jobs:
      - build-aarch64
      - build-bazel:
          matrix:
            parameters:
              os: [linux, darwin]
              config: [gcc, clang]
            exclude:
              - os: darwin
                config: gcc
