name: Darwin (amd64)

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.cc'
      - '**/*.hh'
      - '.github/workflows/darwin-intel.yml'
      - '**/*.bazel'
      - '**/*.bzl'

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
      - name: Bazel test
        run: bazel test --config=system-clang --config=san --noexperimental_cpp_modules ...
