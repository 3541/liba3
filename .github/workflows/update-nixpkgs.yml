name: Update Nixpkgs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nixpkgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read nixpkgs.json
        id: config
        run: |
          echo "repo=$(jq -r '.repo // "NixOS/nixpkgs"' nixpkgs.json)" >> $GITHUB_OUTPUT
          echo "branch=$(jq -r '.branch // "nixos-25.11"' nixpkgs.json)" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          path: nixpkgs
          repository: ${{ steps.config.outputs.repo }}
          ref: ${{ steps.config.outputs.branch }}
      - uses: samueldr/lix-gha-installer-action@8dc19fbd6451fa106a68ecb2dafeeeb90dff3a29
      - name: Select new Nixpkgs commit
        id: nixpkgs
        env:
          REPO: ${{ steps.config.outputs.repo }}
          BRANCH: ${{ steps.config.outputs.branch }}
        run: |
          cd nixpkgs
          commit="$(git rev-parse "$BRANCH")"
          cd ..
          hash="$(nix-prefetch-url --unpack "https://github.com/$REPO/tarball/$commit")"

          old_commit="$(jq -r '.commit' nixpkgs.json)"

          if [ "$commit" = "$old_commit" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "No update needed. Already at $commit"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "new_commit=$commit" >> $GITHUB_OUTPUT
            echo "new_sha256=$hash" >> $GITHUB_OUTPUT
            echo "Update available: $old_commit -> $commit"
          fi
      - name: Update nixpkgs.json
        if: steps.nixpkgs.outputs.needs_update == 'true'
        run: |
          jq -n \
            --arg repo "${{ steps.config.outputs.repo }}" \
            --arg branch "${{ steps.config.outputs.branch }}" \
            --arg commit "${{ steps.nixpkgs.outputs.new_commit }}" \
            --arg sha256 "${{ steps.nixpkgs.outputs.new_sha256 }}" \
            '{repo: $repo, branch: $branch, commit: $commit, sha256: $sha256}' > nixpkgs.json
      - name: Update Bazel lockfile
        if: steps.nixpkgs.outputs.needs_update == 'true'
        run: nix-shell --command "bazel mod deps --lockfile_mode=update"
      - name: Create Pull Request
        if: steps.nixpkgs.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.config.outputs.repo }}
          NIXPKGS_BRANCH: ${{ steps.config.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit="${{ steps.nixpkgs.outputs.new_commit }}"
          short_commit="${commit:0:7}"
          branch="update-nixpkgs-$short_commit"

          git checkout -b "$branch"
          git add nixpkgs.json MODULE.bazel.lock
          git commit -m "Update Nixpkgs to $short_commit"
          git push -u origin "$branch"

          gh pr create \
            --base trunk \
            --title "Update Nixpkgs to $short_commit" \
            --body "Updates Nixpkgs pin to commit [$commit](https://github.com/$REPO/commit/$commit) from the $NIXPKGS_BRANCH branch."
      - name: No update needed
        if: steps.nixpkgs.outputs.needs_update == 'false'
        run: |
          echo "### No Nixpkgs update needed" >> $GITHUB_STEP_SUMMARY
          echo "Already at the latest commit from ${{ steps.config.outputs.branch }}." >> $GITHUB_STEP_SUMMARY

